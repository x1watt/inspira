name: inspira
description: "Wisdom from history: quotes on relations, leadership, team, family and strategy."
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  # Reads the offline Wikipedia database on Android and desktop (the web
  # build never imports it: lib/data/wiki/wiki_service.dart).
  zx:
    git:
      url: https://github.com/x1watt/zx.git
      ref: 24481236e0f8bd61a821c5ed5b6dfc3d769983f8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/quotes.json
    - assets/stories.json
    - assets/events.json
    - assets/wiki_places.json
    - assets/images.json
    - assets/images/avatars/
    - assets/images/art/
